name: Build Screens for Mac
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: arm64
            script: dist:mac
          - arch: x64
            script: dist:mac:intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged application and disk image signatures
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac*/Screens.app)
          images=(dist/*.dmg)
          test "${#apps[@]}" -eq 1
          test "${#images[@]}" -eq 1
          codesign --verify --deep --strict --verbose=4 "${apps[0]}"
          hdiutil verify "${images[0]}"
          mount_dir="$(mktemp -d)"
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"; rmdir "$mount_dir"' EXIT
          codesign --verify --deep --strict --verbose=4 "$mount_dir/Screens.app"
      - uses: actions/upload-artifact@v4
        with:
          name: Screens-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Screens-*
          merge-multiple: true
          path: installers
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/*.dmg --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
